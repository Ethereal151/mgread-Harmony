name: Build verification

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

run-name: Build ${{ github.ref_name }} @ ${{ github.sha }}

# A burst of pushes should produce only one expensive build.
# A newer push cancels both queued and running builds for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.16.0"
  NPM_VERSION: "11.13.0"

jobs:
  debounce:
    name: Wait for push burst
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Debounce rapid pushes
        if: github.event_name == 'push'
        run: sleep 60

  android:
    name: Android release APK
    needs: debounce
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/mg_read_node_runtime/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Build Android Runtime assets
        working-directory: packages/mg_read_node_runtime
        run: |
          npm ci
          npm run build

      - name: Ensure declared Runtime asset directories exist
        shell: bash
        run: |
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/dist/debug-ui
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/dist/debug-ui

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release --target-platform android-arm64 --no-pub

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: mgread-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    name: Windows x64 release
    needs: debounce
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch Windows Node Runtime from Git LFS
        shell: pwsh
        run: git lfs pull --include="packages/mg_read_node_runtime/tools/node-v24.16.0-win-x64/node.exe" --exclude=""

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/mg_read_node_runtime/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Build and stage Windows Runtime
        working-directory: packages/mg_read_node_runtime
        run: |
          npm ci
          npm run stage:flutter-windows

      - name: Ensure declared Runtime asset directories exist
        shell: bash
        run: |
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/dist/debug-ui
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/dist/debug-ui

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --no-pub

      - name: Package Windows build
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/mgread-windows-x64.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: mgread-windows-x64-${{ github.sha }}
          path: build/mgread-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    name: macOS arm64 release
    needs: debounce
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch macOS Node Runtime from Git LFS
        run: git lfs pull --include="packages/mg_read_node_runtime/tools/node-v24.16.0-darwin-arm64/bin/node" --exclude=""

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/mg_read_node_runtime/package-lock.json

      - name: Pin npm
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Build and stage macOS Runtime
        working-directory: packages/mg_read_node_runtime
        run: |
          npm ci
          npm run stage:flutter-macos

      - name: Ensure declared Runtime asset directories exist
        shell: bash
        run: |
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/windows-x64/dist/debug-ui
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/node
          mkdir -p packages/mgread_plugin_runtime/assets/runtime/macos-arm64/dist/debug-ui

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
          pub-cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release --no-pub

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/MgRead.app" "build/mgread-macos-arm64.zip"

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: mgread-macos-arm64-${{ github.sha }}
          path: build/mgread-macos-arm64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
