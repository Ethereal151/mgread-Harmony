name: OHOS arm64 release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

run-name: OHOS arm64 release @ ${{ github.sha }}

concurrency:
  group: ohos-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build signed OHOS arm64 HAP
    runs-on: [self-hosted, Windows, ohos]
    timeout-minutes: 120
    environment:
      name: ohos-release
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: true
          lfs: true
          fetch-depth: 1

      - name: Check pinned OHOS runner inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredPaths = @(
            'D:/f-ohos-3449/bin/flutter.bat',
            'D:/mgread-env/node-v20.19.5-win-x64/node.exe',
            'D:/mgread-env/node-v26.10.0-win-x64/node.exe',
            'D:/DevEco Studio/sdk/default/openharmony/native/llvm/bin/llvm-ar.exe',
            'D:/rust/cargo/bin/cargo.exe',
            'D:/rust/rustup/toolchains/1.97.1-x86_64-pc-windows-msvc/bin/rustc.exe',
            'packages/mgread_plugin_runtime/ohos/src/main/cpp/node-runtime/arm64/lib/libnode.so',
            'packages/mgread_plugin_runtime/ohos/src/main/cpp/node-runtime/arm64/mgread-node-target.txt',
            'packages/mgread_plugin_runtime/ohos/src/main/cpp/node-runtime/arm64/include/node.h',
            'packages/mgread_plugin_runtime/ohos/src/main/cpp/node-source/src/node.h',
            'ohos/entry/libs/arm64-v8a/libsqlite3.so'
          )
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Pinned OHOS runner input is missing: $path"
            }
          }

      - name: Restore signing template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $template = git show HEAD:ohos/build-profile.json5 | Out-String
          [IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE 'ohos/build-profile.json5'),
            $template,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Materialize signing files for this job
        shell: pwsh
        env:
          OHOS_CERT_B64: ${{ secrets.OHOS_CERT_B64 }}
          OHOS_PROFILE_B64: ${{ secrets.OHOS_PROFILE_B64 }}
          OHOS_KEYSTORE_B64: ${{ secrets.OHOS_KEYSTORE_B64 }}
          OHOS_KEY_ALIAS: ${{ secrets.OHOS_KEY_ALIAS }}
          OHOS_KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
          OHOS_STORE_PASSWORD: ${{ secrets.OHOS_STORE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $secretNames = @(
            'OHOS_CERT_B64',
            'OHOS_PROFILE_B64',
            'OHOS_KEYSTORE_B64',
            'OHOS_KEY_ALIAS',
            'OHOS_KEY_PASSWORD',
            'OHOS_STORE_PASSWORD'
          )
          foreach ($name in $secretNames) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing ohos-release environment secret: $name"
            }
          }

          $signingRoot = Join-Path $env:RUNNER_TEMP 'mgread-ohos-signing'
          New-Item -ItemType Directory -Force -Path $signingRoot | Out-Null
          function Decode-SecretFile([string] $Name, [string] $Path) {
            $value = [Environment]::GetEnvironmentVariable($Name)
            [IO.File]::WriteAllBytes($Path, [Convert]::FromBase64String($value))
          }
          $certPath = Join-Path $signingRoot 'release.cer'
          $profilePath = Join-Path $signingRoot 'release.p7b'
          $storePath = Join-Path $signingRoot 'release.p12'
          Decode-SecretFile 'OHOS_CERT_B64' $certPath
          Decode-SecretFile 'OHOS_PROFILE_B64' $profilePath
          Decode-SecretFile 'OHOS_KEYSTORE_B64' $storePath

          function Json-String([string] $Value) {
            return (($Value | ConvertTo-Json -Compress).Trim('"'))
          }
          $profileFile = Join-Path $env:GITHUB_WORKSPACE 'ohos/build-profile.json5'
          $profileText = Get-Content -LiteralPath $profileFile -Raw
          $replacements = @{
            '__OHOS_CERT_PATH__' = Json-String $certPath.Replace('\', '/')
            '__OHOS_PROFILE_PATH__' = Json-String $profilePath.Replace('\', '/')
            '__OHOS_STORE_FILE__' = Json-String $storePath.Replace('\', '/')
            '__OHOS_KEY_ALIAS__' = Json-String $env:OHOS_KEY_ALIAS
            '__OHOS_KEY_PASSWORD__' = Json-String $env:OHOS_KEY_PASSWORD
            '__OHOS_STORE_PASSWORD__' = Json-String $env:OHOS_STORE_PASSWORD
          }
          foreach ($item in $replacements.GetEnumerator()) {
            $profileText = $profileText.Replace($item.Key, $item.Value)
          }
          Set-Content -LiteralPath $profileFile -Value $profileText -Encoding utf8

      - name: Build signed OHOS arm64 HAP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEVECO_SDK_HOME = 'D:/DevEco Studio/sdk'
          $env:HOS_SDK_HOME = 'D:/DevEco Studio/sdk'
          $env:OHOS_SDK_HOME = 'D:/DevEco Studio/sdk'
          & ./tools/build_ohos_release.ps1 -BuildMode release -Architecture arm64
          if ($LASTEXITCODE -ne 0) {
            throw "OHOS arm64 release build failed with exit code $LASTEXITCODE"
          }

      - name: Package HAP only
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE '.mgread-build/ohos/release-arm64/output'
          $hap = Get-ChildItem -LiteralPath $outputRoot -Filter '*.hap' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $hap) {
            throw "No arm64 HAP found in $outputRoot"
          }
          $versionLine = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'pubspec.yaml') |
            Where-Object { $_ -match '^version:\s*\S+' } |
            Select-Object -First 1
          $version = [regex]::Match($versionLine, '^version:\s*(\S+)').Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'Unable to read application version from pubspec.yaml'
          }
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'mgread-ohos-release'
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null
          $assetName = "MgRead-$version-ohos-arm64.hap"
          $assetPath = Join-Path $releaseRoot $assetName
          Copy-Item -LiteralPath $hap.FullName -Destination $assetPath -Force
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload signed HAP
        uses: actions/upload-artifact@v7
        with:
          name: mgread-ohos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/mgread-ohos-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove signing material
        if: always()
        shell: pwsh
        run: |
          $signingRoot = Join-Path $env:RUNNER_TEMP 'mgread-ohos-signing'
          if (Test-Path -LiteralPath $signingRoot) {
            Remove-Item -LiteralPath $signingRoot -Recurse -Force
          }

  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish OHOS GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download signed HAP
        uses: actions/download-artifact@v8
        with:
          name: mgread-ohos-arm64-${{ github.sha }}
          path: release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          title="MgRead v${VERSION} OHOS arm64"
          notes="Automated signed OHOS arm64 HAP built from commit ${SOURCE_COMMIT}."
          assets=(release/*.hap)
          if [ ! -e "${assets[0]}" ]; then
            echo 'No release assets were downloaded.' >&2
            exit 1
          fi
          if gh release view "${tag}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --repo "${REPOSITORY}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" \
              --repo "${REPOSITORY}" \
              --target "${SOURCE_COMMIT}" \
              --title "${title}" \
              --notes "${notes}" \
              --latest
          fi

