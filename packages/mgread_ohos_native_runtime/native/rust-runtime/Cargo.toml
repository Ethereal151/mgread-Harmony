[package]
name = "mgread-ohos-native-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "mgread_rust_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
mgread-native-runtime = { path = "../../../mg_read_native_runtime" }
serde_json = "=1.0.151"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "sync", "net", "time", "fs", "io-util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
