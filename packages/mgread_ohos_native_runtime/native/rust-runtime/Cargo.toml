[package]
name = "mgread-ohos-native-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "mgread_rust_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.22.1"
scraper = { version = "=0.27.0", default-features = false }
serde_json = "=1.0.151"
ureq = { version = "=3.1.4", default-features = false, features = ["rustls"] }
url = "=2.5.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
