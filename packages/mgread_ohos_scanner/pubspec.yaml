environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ohos:
        package: com.mgread.mgread_ohos_scanner
        pluginClass: MgReadOhosScannerPlugin
